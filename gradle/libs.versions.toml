turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
robolectric = { module = "org.robolectric:robolectric", version = "4.17" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
