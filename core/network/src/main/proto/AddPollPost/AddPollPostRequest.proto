syntax = "proto3";

package tieba.addPollPost;

option java_package = "oolong.core.network.protos.addPollPost";

message AddPollPostRequest {
  AddPollPostRequestData data = 1;
}

message AddPollPostRequestData {
  optional uint64 forum_id = 4;
  // The chosen options' ids, joined with commas
  optional string options = 2;
  optional uint64 thread_id = 1;
}
