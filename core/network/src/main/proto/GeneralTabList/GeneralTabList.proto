syntax = "proto3";

package tieba.generalTabList;

option java_package = "oolong.core.network.protos.generalTabList";

import "CommonRequest.proto";
import "Feed/FeedLayout.proto";
import "ThreadInfo.proto";
import "User.proto";
import "Error.proto";

message GeneralTabListRequestData {
  optional string ad_bear_context = 16;
  optional string ad_bear_sid = 18;
  optional double ad_bear_sid_price = 19;
  optional string ad_ext_params = 15;
  CommonRequest common = 1;
  optional int64 forum_id = 3;
  optional string frs_common_info = 21;
  optional int32 has_ad_bear = 17;
  optional int32 is_default_navtab = 10;
  optional int32 is_general_tab = 12;
  optional int32 is_newfrs = 22;
  optional int32 is_video_doublerow = 23;
  optional int64 last_thread_id = 9;
  optional int32 pn = 4;
  optional int32 request_times = 20;
  optional int32 rn = 5;
  optional int32 scr_dip = 8;
  optional int32 scr_h = 7;
  optional int32 scr_w = 6;
  optional int32 sort_type = 13;
  optional int32 tab_id = 2;
  optional string tab_name = 11;
  optional int32 tab_type = 14;
  optional string forum_name = 29;
  optional int32 partition_type = 30;
}

message GeneralTabListRequest {
  GeneralTabListRequestData data = 1;
}

message GeneralTabListResponseData {
  repeated ThreadInfo general_list = 1;
  int32 has_more = 2;
  repeated User user_list = 3;
  int32 new_thread_num = 6;
  int32 sort_type = 7;
  /** The threads laid out as the new forum page shows them, in place of [general_list]. */
  tieba.feed.FeedPage page_data = 14;
}

message GeneralTabListResponse {
  Error error = 1;
  GeneralTabListResponseData data = 2;
}
