syntax = "proto3";

package tieba.pbFloor;

option java_package = "oolong.core.network.protos.pbFloor";

import "CommonRequest.proto";

message PbFloorRequestData {
    CommonRequest common = 9;
    optional int64 forum_id = 11;
    optional int32 is_comm_reverse = 10;
    optional int64 kz = 1;
    optional string ori_ugc_nid = 12;
    optional string ori_ugc_tid = 13;
    optional int32 ori_ugc_type = 15;
    optional string ori_ugc_vid = 16;
    optional int64 pid = 2;
    optional int32 pn = 4;
    optional string preview_spids = 20;
    optional double scr_dip = 7;
    optional int32 scr_h = 6;
    optional int32 scr_w = 5;
    optional int32 sort = 19;
    optional int64 spid = 3;
    optional string st_type = 8;
    optional string top_ugc_pid = 17;
}
