syntax = "proto3";

package tieba;

option java_package = "oolong.core.network.protos";

// Declared in name order, the order the fields are written in; every field the request sets is
// written, empty or zero ones included.
message CommonRequest {
  optional string BDUSS = 10;
  optional int32 _client_type = 1;
  optional string _client_version = 2;
  optional int64 _timestamp = 8;
  optional int64 active_timestamp = 49;
  optional string ad_context = 90;
  optional string applist = 29;
  optional string c3_aid = 35;
  optional string cam = 66;
  optional int32 cmode = 55;
  optional string cuid = 7;
  optional string cuid_galaxy2 = 32;
  optional string cuid_gid = 33;
  optional string device_score = 70;
  optional string di_diordna = 68;
  optional string diao = 74;
  optional string dnarb = 76;
  optional string event_day = 53;
  optional string extra = 61;
  optional int64 first_install_time = 50;
  optional string framework_ver = 43;
  optional string from = 6;
  optional string iemi = 64;
  optional int32 is_teenager = 41;
  optional int64 last_update_time = 51;
  optional string ledom = 73;
  optional string lego_lib_version = 28;
  optional string naws_game_ver = 44;
  optional int32 need_cam_decrypt = 82;
  optional int32 need_decrypt = 81;
  optional int32 net_type = 12;
  optional string noisrev_so = 75;
  optional string package_version = 88;
  optional int32 personalized_rec_switch = 63;
  optional string pversion = 24;
  optional int32 q_type = 40;
  optional string sample_id = 36;
  optional double scr_dip = 39;
  optional int32 scr_h = 38;
  optional int32 scr_w = 37;
  optional string sdk_ver = 42;
  optional string start_scheme = 56;
  optional int32 start_type = 57;
  optional string stoken = 30;
  optional string support_image = 87;
  optional string tbs = 11;
  optional string user_agent = 62;
  optional string z_id = 31;
}
