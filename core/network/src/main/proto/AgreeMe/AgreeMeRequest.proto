syntax = "proto3";

package tieba.agreeMe;

option java_package = "oolong.core.network.protos.agreeMe";

import "CommonRequest.proto";

message AgreeMeRequest {
  AgreeMeRequestData data = 1;
}

message AgreeMeRequestData {
  CommonRequest common = 1;
  /** The last item's id for the next page; 0 for the first. */
  optional uint64 id = 2;
  optional int32 q_type = 7;
  optional int32 rn = 3;
  optional int32 scr_dip = 6;
  optional int32 scr_h = 5;
  optional int32 scr_w = 4;
}
