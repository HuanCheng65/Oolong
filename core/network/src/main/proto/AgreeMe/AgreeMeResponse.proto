syntax = "proto3";

package tieba.agreeMe;

option java_package = "oolong.core.network.protos.agreeMe";

import "Error.proto";
import "Post.proto";
import "ThreadInfo.proto";
import "User.proto";

message AgreeMeResponse {
  Error error = 1;
  AgreeMeResponseData data = 2;
}

message AgreeMeResponseData {
  int32 has_more = 1;
  repeated AgreeItem agree_list = 2;
}

/** One user's like on one of the user's posts. */
message AgreeItem {
  ThreadInfo thread_info = 1;
  uint32 time = 4;
  int32 is_del = 5;
  /** 1 a post in the thread, 2 a reply inside a post. */
  int32 type = 6;
  uint64 id = 7;
  User agreeer = 8;
  Post post_info = 9;
  string target_scheme = 12;
}
