syntax = "proto3";

package tieba;

option java_package = "oolong.core.network.protos.personalized";

import "CommonRequest.proto";
import "ThreadInfo.proto";
import "AppPosInfo.proto";
import "Error.proto";
import "AppTransmitData.proto";
import "Toast.proto";

message PersonalizedRequestData {
  optional string ad_context_list = 30;
  optional string ad_ext_params = 37;
  optional string ad_external_info = 45;
  AppPosInfo app_pos = 36;
  AppTransmitData app_transmit_data = 38;
  optional uint32 cache_column_style = 46;
  CommonRequest common = 1;
  optional string invoke_source = 29;
  optional uint32 is_new_user = 44;
  optional int32 is_newfeed = 40;
  optional uint32 load_type = 4;
  optional uint32 need_forumlist = 22;
  optional uint32 need_tags = 3;
  optional int32 new_install = 27;
  optional uint32 new_net_type = 23;
  optional uint32 page_thread_count = 5;
  optional uint32 pn = 6;
  optional int32 pre_ad_thread_count = 26;
  optional int32 q_type = 11;
  optional int32 request_times = 28;
  optional double scr_dip = 10;
  optional int32 scr_h = 9;
  optional int32 scr_w = 8;
  optional uint32 sug_count = 7;
  optional uint32 tag_code = 2;
}

message PersonalizedRequest {
  PersonalizedRequestData data = 1;
}

message PersonalizedResponseData {
  repeated ThreadInfo thread_list = 2;
  repeated ThreadPersonalized thread_personalized = 7;
}

message PersonalizedResponse {
  Error error = 1;
  PersonalizedResponseData data = 2;
}

message ThreadPersonalized {
  uint64 tid = 1;
  string weight = 2;
  string source = 3;
  repeated DislikeReason dislikeResource = 5;
  string extra = 6;
}

message DislikeReason {
  string dislikeReason = 1;
  uint32 dislikeId = 2;
  string extra = 3;
  string schema = 4;
  Toast toast = 5;
}